<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualisation de la percolation</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <h1>Explorateur de percolation</h1>
        <p class="subtitle">
          Visualisation interactive de la percolation de sites sur une grille carrée.
        </p>
      </header>

      <main class="app-main">
        <section class="controls">
          <div class="control-group">
            <label for="grid-type">Type de grille</label>
            <select id="grid-type">
              <option value="square" selected>Carrée</option>
              <option value="triangular" disabled>Triangulaire (bientôt)</option>
              <option value="hex" disabled>Hexagonale (bientôt)</option>
            </select>
          </div>

          <div class="control-group">
            <label for="grid-size">
              Taille de la grille
              <span id="grid-size-label"></span>
            </label>
            <input
              type="range"
              id="grid-size"
              min="10"
              max="80"
              step="5"
              value="30"
            />
          </div>

          <div class="control-group">
            <label for="occupation-prob">
              Probabilité d’occupation \(p\)
              <span id="occupation-prob-label"></span>
            </label>
            <input
              type="range"
              id="occupation-prob"
              min="0"
              max="1"
              step="0.01"
              value="0.55"
            />
          </div>

          <div class="buttons">
            <button id="btn-randomize">Aléatoire</button>
            <button id="btn-step">Ouvrir un site</button>
            <button id="btn-reset" class="secondary">Réinitialiser</button>
          </div>

          <div class="status">
            <div><strong>Percole&nbsp;:</strong> <span id="status-percolates">Non</span></div>
            <div><strong>Sites ouverts&nbsp;:</strong> <span id="status-open-count">0</span></div>
            <div>
              <strong>Seuil de percolation (théorique)&nbsp;:</strong>
              <span id="status-threshold">≈ 0,593 (grille carrée)</span>
            </div>
          </div>
        </section>

        <section class="canvas-wrapper">
          <canvas id="percolation-canvas"></canvas>
        </section>
      </main>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
  </html>
